spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/care_access}
    username: ${DATABASE_USER:care_access}
    password: ${DATABASE_PASSWORD:care_access}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
server:
  port: 8080
