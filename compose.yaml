services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: care_access
      POSTGRES_USER: care_access
      POSTGRES_PASSWORD: care_access
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_access -d care_access"]
      interval: 5s
      timeout: 3s
      retries: 15
